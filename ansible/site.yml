---
# Playbook de demostracion para el analisis de seguridad IaC.
# ESTADO: REMEDIADO (PR de correccion).

- name: Configuracion del servidor web
  hosts: all
  become: true
  tasks:
    - name: Actualizar la cache de paquetes
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Instalar nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Copiar configuracion de nginx
      ansible.builtin.copy:
        src: files/nginx.conf
        dest: /etc/nginx/nginx.conf
        owner: root
        group: root
        mode: "0644"

    - name: Habilitar nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
